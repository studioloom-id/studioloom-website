<section class="statement-section">
  <div class="fade-up">
    <p class="lead-copy">Studio Loom takes on a select number of projects at a time, so each gets the studio's full attention.</p>
    <p class="lead-copy"><em>Every engagement begins with a design consultation. The fee is credited toward your project when you proceed.</em></p>
  </div>
</section>

<section class="split-section" id="contact">
  <div class="split-text fade-up">
    <span class="section-label">Get in Touch</span>
    <h2 class="section-title">Tell us about your <em>project.</em></h2>

    <form class="enquiry-form" id="enquiry-form" action="https://formspree.io/f/mrpezrrd" method="POST">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="project_type">Project Type</label>
        <select id="project_type" name="project_type" required>
          <option value="">Select one</option>
          <option value="Residential">Residential</option>
          <option value="Commercial">Commercial</option>
          <option value="Hospitality">Hospitality</option>
        </select>
      </div>
      <div>
        <label for="service_type">Service Type</label>
        <select id="service_type" name="service_type" required>
          <option value="">Select one</option>
          <option value="Turnkey">Turnkey Interior Design</option>
          <option value="Consultation">Design Consultation</option>
          <option value="Styling">Interior Styling</option>
          <option value="Not sure">Not sure yet</option>
        </select>
      </div>
      <div>
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. DLF Phase 5, Gurugram">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell us about your space and brief"></textarea>
      </div>
      <button class="btn-primary" type="submit">Send enquiry</button>
      <p class="form-status" id="form-status"></p>
    </form>
  </div>
  <div class="split-img-inset">
    <picture>
      <source srcset="/assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait-sm.avif 480w, /assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait.avif 960w" sizes="(min-width: 1024px) 50vw, 100vw" type="image/avif">
      <source srcset="/assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait-sm.webp 480w, /assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait.webp 960w" sizes="(min-width: 1024px) 50vw, 100vw" type="image/webp">
      <img class="portrait" srcset="/assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait-sm.jpg 480w, /assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait.jpg 960w" sizes="(min-width: 1024px) 50vw, 100vw" src="/assets/images/solanki-residence/solanki-residence-bedroom-quiet-luxury-gurugram-01-portrait.jpg"
         alt="Bedroom with a patterned upholstered headboard, quilted cream bedspread, and sheer curtains, Studio Loom, Gurugram"
         width="960" height="1200" loading="lazy">
    </picture>
  </div>
</section>
