<section class="split-section" id="contact">
  <div class="split-text fade-up">
    <span class="section-label">Get in Touch</span>
    <h2 class="section-title">Tell us about your <em>project.</em></h2>

    <!-- TODO: replace this form action with the real Formspree/Web3Forms endpoint once the account is created -->
    <form class="enquiry-form" id="enquiry-form" action="https://formspree.io/f/TODO_REPLACE_WITH_REAL_FORM_ID" method="POST">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="project_type">Project Type</label>
        <select id="project_type" name="project_type" required>
          <option value="">Select one</option>
          <option value="Residential">Residential</option>
          <option value="Commercial">Commercial</option>
          <option value="Hospitality">Hospitality</option>
        </select>
      </div>
      <div>
        <label for="service_type">Service Type</label>
        <select id="service_type" name="service_type" required>
          <option value="">Select one</option>
          <option value="Turnkey">Turnkey Interior Design</option>
          <option value="Consultation">Design Consultation</option>
          <option value="Styling">Interior Styling</option>
          <option value="Not sure">Not sure yet</option>
        </select>
      </div>
      <div>
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. DLF Phase 5, Gurugram">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell us about your space and brief"></textarea>
      </div>
      <button class="btn-primary" type="submit">Send enquiry</button>
      <p class="form-status" id="form-status"></p>
    </form>
  </div>
