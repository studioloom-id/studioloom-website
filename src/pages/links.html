<style>
  :root {
    --terracotta: #A9543B;
    --terracotta-dark: #8F4530;
    --charcoal: #231F1C;
    --bg: #FBF8F4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--charcoal);
    font-family: 'Jost', system-ui, sans-serif; font-weight: 300; line-height: 1.6;
    display: flex; justify-content: center; align-items: center; padding: 2.5rem 1.5rem;
  }
  .links { width: 100%; max-width: 380px; text-align: center; }
  .links-logo { width: 72px; height: 72px; display: block; margin: 0 auto 1.4rem; }
  .links-name { font-weight: 400; font-size: 1.05rem; letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase; }
  .links-tagline { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.35rem; color: var(--terracotta); margin-top: 0.5rem; }
  .links-intro { font-size: 0.95rem; margin: 1.4rem auto 2.2rem; max-width: 320px; }
  .links-list { display: grid; gap: 0.8rem; }

  /* To add a new link (Instagram, LinkedIn, etc.): copy one whole <a class="links-btn"> ... </a>
     block below, paste it where you want it in the list, then change the href and the label. */
  .links-btn {
    display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0.8rem 1.2rem;
    background: var(--terracotta); color: #fff; text-decoration: none;
    font-weight: 400; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase;
    transition: background 0.2s;
  }
  .links-btn:hover, .links-btn:focus-visible { background: var(--terracotta-dark); }
  .links-btn:focus-visible, .links-contact a:focus-visible { outline: 2px solid var(--charcoal); outline-offset: 3px; }

  .links-contact { margin-top: 2.2rem; display: grid; gap: 0.35rem; font-size: 0.95rem; }
  .links-contact a { color: var(--charcoal); text-decoration: none; }
  .links-contact a:hover { color: var(--terracotta); }
</style>

<main class="links">
  <img class="links-logo" src="/assets/images/brand/studio-loom-mark.png" width="72" height="72" alt="Studio Loom logo">
  <h1 class="links-name">Studio Loom</h1>
  <p class="links-tagline">Spaces Shaped with Soul</p>
  <p class="links-intro">A contemporary Indian interior design studio based in Gurugram, working Pan India.</p>

  <nav class="links-list" aria-label="Studio Loom links">
    <a class="links-btn" href="https://studioloom.co.in/">Visit our website</a>
    <a class="links-btn" href="https://www.houzz.in/pro/studio-loom/__public" target="_blank" rel="noopener noreferrer">See our work on Houzz</a>
    <a class="links-btn" href="https://in.pinterest.com/studioloomid/" target="_blank" rel="noopener noreferrer">Find ideas on Pinterest</a>
    <a class="links-btn" href="https://studioloom.co.in/contact">Send us a brief</a>
  </nav>

  <div class="links-contact">
    <a href="tel:+918800110317">+91 8800 110 317</a>
    <a href="mailto:projects@studioloom.co.in">projects@studioloom.co.in</a>
  </div>
</main>
